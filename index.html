      )}
      {cfg && (
        <div style={{ position: "absolute", inset: 0, background: "#fff0f6f8", zIndex: 9, padding: 18, overflow: "auto" }} onClick={(e) => e.stopPropagation()}>
          <h2 style={{ margin: "0 0 8px", color: "#a3225c" }}>AI 設定</h2>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>{[["claude", "Claude（只在 claude.ai 內可用）"], ["gemini", "Gemini（自備 Key）"]].map(([k, l]) => <button key={k} className="btn" style={{ background: prov === k ? "#ec5f92" : undefined, color: prov === k ? "#fff" : undefined }} onClick={() => setProv(k)}>{l}</button>)}</div>
          {prov === "gemini" && <div style={{ display: "grid", gap: 8 }}>
            <input type="password" value={key} onChange={(e) => setKey(e.target.value)} placeholder="貼上 Gemini API Key" style={{ padding: 10, borderRadius: 12, border: "2px solid #ec5f92", fontSize: 14 }} />
            <input value={model} onChange={(e) => setModel(e.target.value)} placeholder="模型名稱" style={{ padding: 10, borderRadius: 12, border: "2px solid #ec5f92", fontSize: 14 }} />
            <div style={{ fontSize: 12, opacity: 0.75, lineHeight: 1.6 }}>Key 只存在這個畫面的記憶體裡，關掉就消失，只會直接送到 Google。若在 claude.ai 預覽裡連不上 Gemini，請把這個檔案放到自己的 React 專案或本機執行。</div></div>}
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 12, flexWrap: "wrap" }}><button className="btn" onClick={testConn}>🔌 測試連線</button><span style={{ fontSize: 13 }}>{test}</span></div>
          <button className="btn" style={{ marginTop: 12 }} onClick={() => setCfg(false)}>完成</button>
        </div>
      )}
      {panel && (
        <div style={{ position: "absolute", inset: 0, background: "#fff0f6f8", zIndex: 9, padding: 18, overflow: "auto" }} onClick={(e) => e.stopPropagation()}>
          <h2 style={{ margin: "0 0 8px" }}>好感度　<span style={{ fontSize: 13, fontWeight: 400 }}>道具：{st.inv.length ? st.inv.join("、") : "無"}</span></h2>
          {Object.keys(P).filter((k) => k !== "bd" && k !== "mz").map((k) => <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, margin: "5px 0", fontSize: 13 }}><span style={{ width: 84 }}>{P[k][0]}</span><span style={{ flex: 1, height: 9, background: "#f7cfe0", borderRadius: 5 }}><i style={{ display: "block", height: "100%", width: aff(k) + "%", background: "#ec5f92", borderRadius: 5 }} /></span><span style={{ width: 28 }}>{aff(k)}</span></div>)}
          <button className="btn" style={{ marginTop: 10 }} onClick={() => setPanel(false)}>關閉</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<QibanGalGame />);
</script></body></html>

          {who && <div style={{ position: "absolute", top: -16, left: 16, background: TEACH.has(who) ? "#b0447a" : "#ec5f92", color: "#fff", borderRadius: 12, padding: "3px 14px", fontWeight: 700 }}>{P[who]?.[0] ?? who}</div>}
          {st.loading ? <div style={{ fontSize: 16, opacity: 0.7 }}>GM 正在想接下來發生什麼…🌸</div> : <div style={{ fontSize: 16, lineHeight: 1.75, minHeight: 56 }}>{who ? "「" : ""}{txt}{who && done.current ? "」" : ""}</div>}
          {!st.loading && !showChoices && !st.settle && <div style={{ textAlign: "right", fontSize: 12, opacity: 0.5 }}>點一下繼續 ▼</div>}
          {showChoices && <div style={{ display: "grid", gap: 7, marginTop: 6 }} onClick={(e) => e.stopPropagation()}>
            {st.choices.map((c, i) => <button key={i} className="btn pop" onClick={() => pickChoice(c)}>{c}</button>)}
            <div style={{ display: "flex", gap: 6 }}><input value={inp} onChange={(e) => setInp(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !e.nativeEvent.isComposing) send(); }} placeholder="自己決定要做什麼…" style={{ flex: 1, padding: 9, borderRadius: 12, border: "2px solid #ec5f92", fontSize: 14, background: "#fff", color: "#3a2430" }} /><button className="btn" onClick={send}>送出</button></div></div>}
        </div>
      </>)}
      {toast && <div className="pop" style={{ position: "absolute", top: 76, left: "50%", transform: "translateX(-50%)", zIndex: 11, background: "#fff", border: "3px solid #ffb703", borderRadius: 14, padding: "8px 16px", textAlign: "center", boxShadow: "0 4px 14px #0003" }}><div style={{ fontSize: 12, color: "#d08700" }}>🏆 解鎖成就</div><div style={{ fontWeight: 700, color: "#a3225c" }}>{toast.name}</div></div>}
      {st.settle && (
        <div style={{ ...overlay, zIndex: 10, padding: 18, background: "linear-gradient(#ffe4efee,#ffc2dcee)" }} onClick={(e) => e.stopPropagation()}>
          <h2 style={{ margin: "10px 0 2px", color: "#a3225c", textAlign: "center" }}>🌸 第 {st.day} 天結算</h2>
          <div style={{ textAlign: "center", fontSize: 13, marginBottom: 10 }}>{dt.getMonth() + 1}/{dt.getDate()}（{WD[dt.getDay()]}）放學了</div>
          <div style={{ background: "#fff", border: "3px solid #ec5f92", borderRadius: 14, padding: 12, fontSize: 14, lineHeight: 1.7, marginBottom: 10 }}>{st.summary || "整理今天的回憶中…"}</div>
          <div style={{ background: "#fff", border: "3px solid #ec5f92", borderRadius: 14, padding: 12, fontSize: 14 }}>
            <div>🍽️ 飢餓 {st.h}　⚡ 精力 {st.e}　📝 小過 {st.m}</div>
            <div style={{ margin: "6px 0" }}>🎒 今天新增道具：{Math.max(0, st.inv.length - st.inv0)} 個</div>
            <div style={{ margin: "6px 0" }}>🏆 今天的成就：{st.ach.filter((a) => a.day === st.day).map((a) => a.name).join("、") || "無"}</div>
            <div style={{ fontWeight: 700, color: "#a3225c", margin: "8px 0 4px" }}>好感度變化</div>
            {Object.keys(st.aff).filter((k) => (st.aff[k] ?? 10) !== (st.aff0[k] ?? 10)).map((k) => { const d = st.aff[k] - (st.aff0[k] ?? 10); return <div key={k} style={{ display: "flex", justifyContent: "space-between" }}><span>{P[k]?.[0]}</span><span style={{ color: d > 0 ? "#2a9d4f" : "#d62828" }}>{d > 0 ? "▲ +" : "▼ "}{d}（{st.aff[k]}/100）</span></div>; })}
            {Object.keys(st.aff).filter((k) => (st.aff[k] ?? 10) !== (st.aff0[k] ?? 10)).length === 0 && <div style={{ opacity: 0.6 }}>今天沒有變化</div>}
          </div>
          <button className="btn" style={{ marginTop: 14, width: "100%", textAlign: "center", fontWeight: 700 }} onClick={nextDay}>進入第 {st.day + 1} 天 ▶</button>
        </div>
      )}
      {bag && (
        <div style={overlay} onClick={(e) => e.stopPropagation()}>
          <X onClick={() => setBag(false)} />
          <h2 style={{ margin: "0 0 10px", color: "#a3225c" }}>🎒 背包　<span style={{ fontSize: 13, fontWeight: 400 }}>{stacks.length}/{SLOTS} 格</span></h2>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 6, background: "#f7cfe0", padding: 8, borderRadius: 14, border: "3px solid #ec5f92" }}>
            {Array.from({ length: SLOTS }).map((_, i) => { const it = stacks[i]; const on = sel === i; return (
              <div key={i} onClick={() => setSel(i)} style={{ aspectRatio: "1", background: it ? "#fff" : "#ffffff88", border: on ? "3px solid #a3225c" : "2px solid #ec5f9288", borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, position: "relative", cursor: "pointer", boxShadow: on ? "0 0 10px #ec5f92" : "none" }}>
                {it && info(it.n)[0]}{it && it.c > 1 && <span style={{ position: "absolute", right: 4, bottom: 1, fontSize: 12, fontWeight: 700, color: "#a3225c" }}>x{it.c}</span>}
              </div>); })}
          </div>
          <div style={{ marginTop: 10, minHeight: 92, background: "#fff", border: "3px solid #ec5f92", borderRadius: 14, padding: 12 }}>
            {stacks[sel] ? (<>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#a3225c" }}>{info(stacks[sel].n)[0]} {info(stacks[sel].n)[1]}</div>
              <div style={{ fontSize: 14, margin: "6px 0 8px", lineHeight: 1.6 }}>{info(stacks[sel].n)[2]}</div>
              <div style={fsx}>{info(stacks[sel].n)[3] && <button className="btn" onClick={() => useItem(stacks[sel].n)}>使用</button>}<button className="btn" onClick={() => dropItem(stacks[sel].n)}>丟棄</button></div>
            </>) : <div style={{ opacity: 0.6, fontSize: 14 }}>這一格是空的。多撿東西、多跟同學互動吧。</div>}
          </div>
          <div style={{ fontSize: 12, opacity: 0.7, marginTop: 6 }}>飢餓 {st.h}｜精力 {st.e}</div>
        </div>
      )}
      {cfg && (
        <div style={overlay} onClick={(e) => e.stopPropagation()}>
          <X onClick={() => setCfg(false)} />
          <h2 style={{ margin: "0 0 8px", color: "#a3225c" }}>AI 設定</h2>
          <div style={{ ...fsx, marginBottom: 10 }}>{[["claude", "Claude（只在 claude.ai 內可用）"], ["gemini", "Gemini（自備 Key）"]].map(([k, l]) => <button key={k} className="btn" style={{ background: prov === k ? "#ec5f92" : undefined, color: prov === k ? "#fff" : undefined }} onClick={() => setProv(k)}>{l}</button>)}</div>
          {prov === "gemini" && <div style={{ display: "grid", gap: 8 }}>
            <input type="password" value={key} onChange={(e) => setKey(e.target.value)} placeholder="貼上 Gemini API Key" style={{ padding: 10, borderRadius: 12, border: "2px solid #ec5f92", fontSize: 14 }} />
            <input value={model} onChange={(e) => setModel(e.target.value)} placeholder="模型名稱" style={{ padding: 10, borderRadius: 12, border: "2px solid #ec5f92", fontSize: 14 }} />
            <div style={{ fontSize: 12, opacity: 0.75, lineHeight: 1.6 }}>Key 只存在這個畫面的記憶體裡，關掉就消失，只會直接送到 Google。</div></div>}
          <div style={{ ...fsx, marginTop: 12, flexWrap: "wrap" }}><button className="btn" onClick={testConn}>🔌 測試連線</button><span style={{ fontSize: 13 }}>{test}</span></div>
        </div>
      )}
      {schedP && (
        <div style={overlay} onClick={(e) => e.stopPropagation()}>
          <X onClick={() => setSchedP(false)} />
          <h2 style={{ margin: "0 0 4px", color: "#a3225c" }}>📅 今日課表</h2>
          <div style={{ fontSize: 12, opacity: 0.7, marginBottom: 8 }}>{dt.getMonth() + 1}/{dt.getDate()}（{WD[dt.getDay()]}）第 {st.day} 天</div>
          {(st.sched && st.sched.length ? st.sched : slots.map((x) => x[0] + (x[1] ? "｜" + x[1] : ""))).map((row, i) => <div key={i} style={{ background: i === st.slot ? "#ffd3e4" : "#fff", border: i === st.slot ? "3px solid #a3225c" : "2px solid #ec5f9288", borderRadius: 12, padding: "8px 12px", margin: "6px 0", fontSize: 14, opacity: i < st.slot ? 0.55 : 1 }}>{i < st.slot ? "✓ " : i === st.slot ? "▶ " : ""}{row}</div>)}
        </div>
      )}
      {achP && (
        <div style={overlay} onClick={(e) => e.stopPropagation()}>
          <X onClick={() => setAchP(false)} />
          <h2 style={{ margin: "0 0 8px", color: "#a3225c" }}>🏆 成就　<span style={{ fontSize: 13, fontWeight: 400 }}>{st.ach.length} 個</span></h2>
          {st.ach.length === 0 && <div style={{ opacity: 0.6, fontSize: 14 }}>還沒有成就。做點有趣（或荒謬）的事吧，名字會由 AI 亂掰。</div>}
          {st.ach.map((a, i) => <div key={i} style={{ background: "#fff", border: "3px solid #ffb703", borderRadius: 12, padding: "8px 12px", margin: "6px 0" }}><div style={{ fontWeight: 700, color: "#a3225c" }}>🏆 {a.name}</div><div style={{ fontSize: 13, margin: "2px 0" }}>{a.desc}</div><div style={{ fontSize: 11, opacity: 0.6 }}>第 {a.day} 天</div></div>)}
        </div>
      )}
      {panel && (
        <div style={overlay} onClick={(e) => e.stopPropagation()}>
          <X onClick={() => setPanel(false)} />
          <h2 style={{ margin: "0 0 8px", color: "#a3225c" }}>💗 好感度</h2>
          {Object.keys(P).filter((k) => !["bd", "mz", "me"].includes(k)).map((k) => <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, margin: "5px 0", fontSize: 13 }}><span style={{ width: 96 }}>{P[k][0]}</span><span style={{ flex: 1, height: 9, background: "#f7cfe0", borderRadius: 5 }}><i style={{ display: "block", height: "100%", width: aff(k) + "%", background: "#ec5f92", borderRadius: 5 }} /></span><span style={{ width: 28 }}>{aff(k)}</span></div>)}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<QibanGalGame />);
</script></body></html>
